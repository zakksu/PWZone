name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PWCompanion.sln

      - name: Build
        run: dotnet build PWCompanion.sln -c Release --no-restore

      - name: Test
        run: dotnet test PWCompanion.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  webmap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebMap
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
