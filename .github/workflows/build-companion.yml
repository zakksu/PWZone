name: Build Desktop Companion

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/WebMap/package-lock.json

      - name: Build WebMap
        working-directory: src/WebMap
        run: npm ci && npm run build
        env:
          VITE_BASE_PATH: /
          GITHUB_PAGES: 'true'
          VITE_GITHUB_PAGES: 'true'

      - name: Restore
        run: dotnet restore PWCompanion.sln

      - name: Test
        run: dotnet test PWCompanion.sln -c Release --verbosity minimal

      - name: Publish
        run: dotnet publish src/Companion/UI/PWCompanion.UI.csproj -c Release -r win-x64 --self-contained false -o publish/companion

      - name: Copy data and webmap
        run: |
          xcopy /E /I /Y data publish\companion\data
          xcopy /E /I /Y src\WebMap\dist publish\companion\webmap

      - name: Zip artifact
        run: Compress-Archive -Path publish/companion/* -DestinationPath publish/PWCompanion-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWCompanion-win-x64
          path: publish/PWCompanion-win-x64.zip
          retention-days: 90
