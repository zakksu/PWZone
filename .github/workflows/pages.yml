name: Deploy Web Map

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Vite base path (use / for custom domain root, or /RepoName/ for project pages)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebMap
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/WebMap/package-lock.json

      - name: Install
        run: npm ci

      - name: Resolve base path
        id: base
        run: |
          if [ -n "${{ github.event.inputs.base_path }}" ]; then
            echo "path=${{ github.event.inputs.base_path }}" >> $GITHUB_OUTPUT
          elif [ -f public/CNAME ]; then
            echo "path=/" >> $GITHUB_OUTPUT
          else
            echo "path=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_GITHUB_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/WebMap/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
